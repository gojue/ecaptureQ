name: Build packages

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      macos-signing-mode:
        type: string
        default: adhoc
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

env:
  GOWORK: 'off'
  GOFLAGS: '-mod=readonly'
  NFPM_VERSION: v2.48.0

jobs:
  settings:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      macos-signing-mode: ${{ steps.settings.outputs.macos-signing-mode }}
    steps:
      - name: Validate explicit macOS signing mode
        id: settings
        env:
          SIGNING_MODE: ${{ inputs.macos-signing-mode || 'adhoc' }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        shell: bash
        run: |
          case "$SIGNING_MODE" in
            adhoc) ;;
            developer-id)
              if [[ "$EVENT_NAME" != push || "$REF" != refs/tags/v* ]]; then
                echo 'Developer ID signing is only available for version-tag releases.' >&2
                exit 1
              fi
              ;;
            *) echo 'macos-signing-mode must be adhoc or developer-id.' >&2; exit 1 ;;
          esac
          echo "macos-signing-mode=$SIGNING_MODE" >> "$GITHUB_OUTPUT"
          echo "macOS signing mode: $SIGNING_MODE" >> "$GITHUB_STEP_SUMMARY"
  web:
    needs: settings
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: python3 scripts/check-version.py
      - run: go run ./scripts/check-protocol
      - run: GOTOOLCHAIN=go1.26.10 go install github.com/goreleaser/nfpm/v2/cmd/nfpm@"$NFPM_VERSION"
      - name: Build Linux and Windows Web interfaces without GUI dependencies
        shell: bash
        run: |
          version=$(cat VERSION)
          for target_os in linux windows; do
            for target_arch in amd64 arm64; do
              binary="bin/ecaptureq-web-$target_os-$target_arch"
              CGO_ENABLED=0 GOOS="$target_os" GOARCH="$target_arch" \
                go build -trimpath -ldflags "-s -w -X github.com/gojue/ecaptureq/internal/version.Version=$version" -o "$binary" ./cmd/server
              python3 scripts/package-release.py --kind server --os "$target_os" --arch "$target_arch" --binary "$binary"
            done
          done
          # LoongArch Linux is a pure-Go Web build; the desktop has no native target yet.
          binary="bin/ecaptureq-web-linux-loong64"
          CGO_ENABLED=0 GOOS=linux GOARCH=loong64 \
            go build -trimpath -ldflags '-s -w' -o "$binary" ./cmd/server
          python3 scripts/package-release.py --kind server --os linux --arch loong64 --binary "$binary"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-web
          path: dist/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  desktop:
    needs: settings
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: windows-2025, os: windows, arch: amd64}
          - {runner: windows-11-arm, os: windows, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          architecture: ${{ matrix.arch == 'amd64' && 'x64' || 'arm64' }}
      - run: python3 scripts/check-version.py
      - name: Verify native target
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          test "$(go env GOHOSTOS)" = "$TARGET_OS"
          test "$(go env GOHOSTARCH)" = "$TARGET_ARCH"
      - name: Linux build and packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
          GOTOOLCHAIN=go1.26.10 go install github.com/goreleaser/nfpm/v2/cmd/nfpm@"$NFPM_VERSION"
      - run: sh scripts/build-desktop.sh
      - name: Package eCaptureQ
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: python3 scripts/package-release.py --kind desktop --os "$TARGET_OS" --arch "$TARGET_ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  macos:
    needs: settings
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: python3 scripts/check-version.py
      - name: Build and merge Intel and Apple Silicon applications
        run: sh scripts/build-macos-universal.sh
      - name: Prepare bundled licenses and metadata before signing
        env:
          EXPECTED_MODE: ${{ needs.settings.outputs.macos-signing-mode }}
        run: |
          case "$EXPECTED_MODE" in
            adhoc) signing=adhoc ;;
            developer-id) signing=notarized ;;
            *) exit 1 ;;
          esac
          python3 scripts/package-release.py --kind desktop --os darwin --arch universal --signing "$signing" --prepare-app
      - name: Sign final universal application without a certificate
        id: sign-adhoc
        if: ${{ needs.settings.outputs.macos-signing-mode == 'adhoc' }}
        run: bash scripts/sign-macos.sh dist/eCaptureQ.app adhoc
      - name: Sign and notarize final universal application with Developer ID
        id: sign-developer-id
        if: ${{ needs.settings.outputs.macos-signing-mode == 'developer-id' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/sign-macos.sh dist/eCaptureQ.app developer-id
      - name: Verify signing result and create universal distributions
        env:
          SIGNING: ${{ steps.sign-adhoc.outputs.signing || steps.sign-developer-id.outputs.signing || 'unsigned' }}
          EXPECTED_MODE: ${{ needs.settings.outputs.macos-signing-mode }}
        shell: bash
        run: |
          case "$EXPECTED_MODE:$SIGNING" in
            adhoc:adhoc|developer-id:notarized) ;;
            *) echo 'macOS signing result does not match requested mode.' >&2; exit 1 ;;
          esac
          python3 scripts/package-release.py --kind desktop --os darwin --arch universal --signing "$SIGNING" --dmg
          python3 scripts/package-release.py --kind server --os darwin --arch universal --binary bin/ecaptureq-web-macos-universal --signing adhoc
          hdiutil verify dist/packages/*.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-macos-universal
          path: dist/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  macos-install:
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15-intel, arch: x86_64}
          - {runner: macos-15, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: packages-macos-universal
          path: dist/packages
      - name: Verify and run the downloaded universal packages on the native CPU
        env:
          NATIVE_ARCH: ${{ matrix.arch }}
        shell: bash
        run: bash scripts/verify-macos-package.sh dist/packages "$NATIVE_ARCH"
  linux-install:
    needs: [web, desktop]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: packages-*
          path: dist/packages
          merge-multiple: true
      - name: Install and remove DEB and RPM in clean native containers
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          docker run --rm -v "$PWD:/workspace:ro" -v "$PWD/dist/packages:/packages:ro" -w /workspace \
            ubuntu:24.04 bash scripts/verify-linux-install.sh deb "$TARGET_ARCH"
          docker run --rm -v "$PWD:/workspace:ro" -v "$PWD/dist/packages:/packages:ro" -w /workspace \
            fedora:43 bash scripts/verify-linux-install.sh rpm "$TARGET_ARCH"
  verify-packages:
    needs: [web, desktop, macos, macos-install, linux-install]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: packages-*
          path: dist/packages
          merge-multiple: true
      - name: Verify LoongArch Web package architecture metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          version=$(cat VERSION)
          test "$(dpkg-deb --field "dist/packages/ecaptureq-web-$version-linux-loong64.deb" Architecture)" = loong64
          test "$(rpm -qp --queryformat '%{ARCH}' "dist/packages/ecaptureq-web-$version-linux-loong64.rpm")" = loongarch64
      - name: Verify every package and prepare the public downloads
        run: python3 scripts/collect-release.py dist/packages --release-dir dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-bundle
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
